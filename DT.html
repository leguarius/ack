
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Exemple d'encadré</title>

  <style>
    .encadre {
      background-color: #F0F3F6;
      border-radius: 22px;
      padding: 10px 25px;
      margin: 20px 0;
border: 1px solid #9BAFC1;
        color: #405D78;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 16px;
      line-height: 1.6;
    }

    .encadre p {
      margin: 8px 0 0;
    }
  </style>
</head>

<body>

  <h1>Mon document</h1>

  <p>
    Voici un paragraphe normal.
  </p>

  <div class="encadre">
    <strong>Lien vers le fichier</strong>
    <p>DOC-GFHJKLF-ES32  version 3  12/04/2026 – Identification du fabricant légal</p>
  </div>

  <p>
    Le texte normal reprend ici.
  </p>

  <div class="encadre">
    <p>DOC-GFHJKLF-ES32  version 3  12/04/2026 – Identification du fabricant légal</p>
  </div>
</body>
</html>
